name: Deploy to GitHub Pages

# Build the static Next.js export and publish it to GitHub Pages.
# BASE_PATH is derived automatically:
#   - If a public/CNAME file exists (custom domain), the site serves from the
#     root, so BASE_PATH is empty.
#   - For a user page (<user>.github.io) it's also empty.
#   - Otherwise (project page at github.io/<repo>) it's "/<repo>".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ -f public/CNAME ]]; then
            # Custom domain -> served from the root.
            echo "path=" >> "$GITHUB_OUTPUT"
          elif [[ "$REPO" == *.github.io ]]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        run: npm run build
        env:
          BASE_PATH: ${{ steps.base.outputs.path }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
