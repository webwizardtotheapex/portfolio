<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Toyslab Tech brand mark: atom orbits (blue) + gear core (green) -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>
  <g fill="none" stroke="#0860b8" stroke-width="3.2">
    <ellipse cx="32" cy="32" rx="23" ry="9.5"/>
    <ellipse cx="32" cy="32" rx="23" ry="9.5" transform="rotate(60 32 32)"/>
    <ellipse cx="32" cy="32" rx="23" ry="9.5" transform="rotate(120 32 32)"/>
  </g>
  <!-- electrons -->
  <circle cx="55" cy="32" r="2.6" fill="#0860b8"/>
  <circle cx="20.5" cy="13.2" r="2.6" fill="#0860b8"/>
  <circle cx="20.5" cy="50.8" r="2.6" fill="#0860b8"/>
  <!-- gear core -->
  <circle cx="32" cy="32" r="8.5" fill="#184008"/>
  <circle cx="32" cy="32" r="3.2" fill="#ffffff"/>
</svg>
