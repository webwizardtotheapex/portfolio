<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0b14"/>
      <stop offset="1" stop-color="#05060a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Logo mark -->
  <rect x="90" y="90" width="88" height="88" rx="22" fill="url(#brand)"/>
  <path d="M138 108 106 160h22l-6 36 36-56h-24l4-32z" fill="#fff"/>

  <!-- Eyebrow -->
  <text x="92" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="28" letter-spacing="6" fill="#8b9" opacity="0.7">AI AUTOMATION ENGINEER</text>

  <!-- Name -->
  <text x="90" y="380" font-family="Segoe UI, Arial, sans-serif" font-size="88" font-weight="800" fill="#ffffff">Isa Hassan</text>

  <!-- Headline -->
  <text x="92" y="450" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" fill="url(#brand)">Building AI Automations that save businesses</text>
  <text x="92" y="500" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600" fill="url(#brand)">hundreds of hours every month.</text>

  <!-- Tech chips -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="24" fill="#cbd5e1">
    <rect x="92" y="545" width="120" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="118" y="575">n8n</text>
    <rect x="228" y="545" width="150" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="252" y="575">OpenAI</text>
    <rect x="394" y="545" width="170" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="418" y="575">HubSpot</text>
    <rect x="580" y="545" width="200" height="46" rx="23" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="604" y="575">AI Agents</text>
  </g>
</svg>
