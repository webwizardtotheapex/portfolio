<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Projects CMS · Toyslab Portfolio</title>
    <style>
      :root {
        --brand-green: #184008;
        --brand-blue: #0860b8;
        --bg: #0b1120;
        --surface: #121a2e;
        --surface-2: #1a2440;
        --border: #263150;
        --fg: #eef2fb;
        --fg-muted: #9fb0d0;
        --fg-subtle: #6b7a9c;
        --primary: #2b8fe6;
        --danger: #e05660;
        --ok: #2f9e44;
        --radius: 12px;
        --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
      }
      html[data-theme='light'] {
        --bg: #eef1f7;
        --surface: #ffffff;
        --surface-2: #f3f6fc;
        --border: #d7deec;
        --fg: #0c1428;
        --fg-muted: #52607c;
        --fg-subtle: #8793ab;
        --shadow: 0 10px 30px -16px rgba(13, 40, 90, 0.3);
      }
      @media (prefers-color-scheme: light) {
        html[data-theme='system'] {
          --bg: #eef1f7;
          --surface: #ffffff;
          --surface-2: #f3f6fc;
          --border: #d7deec;
          --fg: #0c1428;
          --fg-muted: #52607c;
          --fg-subtle: #8793ab;
          --shadow: 0 10px 30px -16px rgba(13, 40, 90, 0.3);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 20px;
        background: linear-gradient(100deg, var(--brand-green), var(--brand-blue));
        color: #fff;
        box-shadow: var(--shadow);
      }
      header .logo {
        font-weight: 700;
        letter-spacing: 0.2px;
        display: flex;
        align-items: center;
        gap: 9px;
      }
      header .logo .dot {
        width: 11px; height: 11px; border-radius: 50%;
        background: #fff; box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
      }
      header .spacer { flex: 1; }
      header .status { font-size: 12.5px; opacity: 0.95; min-width: 60px; text-align: right; }
      .btn {
        appearance: none; border: 1px solid transparent; cursor: pointer;
        border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 600;
        background: var(--surface-2); color: var(--fg); transition: 0.15s;
      }
      .btn:hover { filter: brightness(1.08); }
      .btn.ghost { background: rgba(255,255,255,0.14); color: #fff; border-color: rgba(255,255,255,0.25); }
      .btn.primary { background: #fff; color: var(--brand-blue); }
      .btn.save { background: var(--ok); color: #fff; }
      .btn.save[disabled] { opacity: 0.5; cursor: not-allowed; }
      .btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
      .btn.danger { color: var(--danger); }
      .layout { display: grid; grid-template-columns: 290px 1fr; gap: 0; min-height: calc(100vh - 56px); }
      /* Sidebar */
      aside {
        border-right: 1px solid var(--border);
        padding: 16px 12px;
        background: var(--surface);
        overflow-y: auto;
        max-height: calc(100vh - 56px);
        position: sticky; top: 56px;
      }
      aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-subtle); margin: 4px 6px 10px; }
      .proj-item {
        display: flex; align-items: center; gap: 8px;
        padding: 9px 10px; border-radius: 10px; cursor: pointer;
        border: 1px solid transparent;
      }
      .proj-item:hover { background: var(--surface-2); }
      .proj-item.active { background: var(--surface-2); border-color: var(--primary); }
      .proj-item .emoji { font-size: 18px; }
      .proj-item .meta { flex: 1; min-width: 0; }
      .proj-item .meta .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .proj-item .meta .s { font-size: 11.5px; color: var(--fg-subtle); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .proj-item .ord { display: flex; flex-direction: column; gap: 1px; }
      .proj-item .ord button { background: none; border: none; color: var(--fg-subtle); cursor: pointer; font-size: 10px; line-height: 1; padding: 1px; }
      .proj-item .ord button:hover { color: var(--fg); }
      /* Editor */
      main { padding: 22px 26px; overflow-y: auto; max-height: calc(100vh - 56px); }
      .empty { color: var(--fg-subtle); text-align: center; margin-top: 15vh; }
      .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
      .card {
        background: var(--surface); border: 1px solid var(--border);
        border-radius: var(--radius); padding: 16px 18px; margin-bottom: 16px;
      }
      .card h3 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--fg-muted); }
      label.field { display: block; margin-bottom: 12px; }
      label.field > span { display: block; font-size: 12.5px; color: var(--fg-muted); margin-bottom: 5px; font-weight: 600; }
      input[type='text'], textarea, select {
        width: 100%; background: var(--surface-2); color: var(--fg);
        border: 1px solid var(--border); border-radius: 9px; padding: 9px 11px;
        font: inherit; outline: none;
      }
      input[type='text']:focus, textarea:focus, select:focus { border-color: var(--primary); }
      textarea { resize: vertical; min-height: 70px; }
      .hint { font-size: 11.5px; color: var(--fg-subtle); margin-top: 4px; }
      /* Tag input */
      .tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 7px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; }
      .tag { display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 3px 6px 3px 10px; font-size: 12.5px; }
      .tag button { background: none; border: none; color: var(--fg-subtle); cursor: pointer; font-size: 13px; line-height: 1; }
      .tag button:hover { color: var(--danger); }
      .tags input { border: none; background: none; flex: 1; min-width: 120px; padding: 4px; color: var(--fg); outline: none; }
      /* Gradient swatches */
      .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
      .swatch { height: 42px; border-radius: 9px; border: 2px solid var(--border); cursor: pointer; position: relative; overflow: hidden; }
      .swatch.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary); }
      /* Link modes */
      .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
      .seg button { background: var(--surface-2); border: none; color: var(--fg-muted); padding: 7px 12px; cursor: pointer; font-size: 12.5px; font-weight: 600; }
      .seg button.on { background: var(--primary); color: #fff; }
      /* Images */
      .thumbs { display: flex; flex-wrap: wrap; gap: 10px; }
      .thumb { width: 120px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface-2); }
      .thumb img { width: 100%; height: 74px; object-fit: cover; display: block; background: #0008; }
      .thumb .bar { display: flex; justify-content: space-between; padding: 4px 5px; }
      .thumb .bar button { background: none; border: none; color: var(--fg-subtle); cursor: pointer; font-size: 12px; }
      .thumb .bar button:hover { color: var(--fg); }
      .uploader { border: 1.5px dashed var(--border); border-radius: 10px; padding: 16px; text-align: center; color: var(--fg-subtle); cursor: pointer; }
      .uploader:hover { border-color: var(--primary); color: var(--fg-muted); }
      /* Arch builder */
      .stage { border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: var(--surface-2); }
      .stage .shead { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .stage .shead input { flex: 1; font-weight: 600; }
      .node { display: grid; grid-template-columns: 1fr 150px 120px auto; gap: 7px; margin-bottom: 7px; align-items: center; }
      .node .k-dot { }
      @media (max-width: 1200px) { .node { grid-template-columns: 1fr 1fr; } }
      /* Preview */
      .preview-card { border: 1px solid var(--border); border-radius: 16px; overflow: hidden; background: var(--surface); }
      .preview-shot { position: relative; aspect-ratio: 16/10; display: flex; align-items: center; justify-content: center; }
      .preview-shot .emoji { font-size: 58px; filter: drop-shadow(0 6px 14px rgba(0,0,0,0.4)); }
      .preview-shot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .preview-body { padding: 16px 18px; }
      .preview-body .tagline { color: var(--primary); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
      .preview-body h4 { margin: 4px 0 8px; font-size: 19px; }
      .preview-body p { color: var(--fg-muted); margin: 0 0 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { font-size: 11.5px; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface-2); color: var(--fg-muted); }
      .flow { display: flex; gap: 8px; overflow-x: auto; padding: 14px; border-top: 1px solid var(--border); }
      .flow .col { min-width: 118px; }
      .flow .col > p { text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-subtle); margin: 0 0 8px; }
      .flow .fnode { display: flex; align-items: center; gap: 7px; border: 1px solid; border-radius: 10px; padding: 7px 9px; margin-bottom: 7px; font-size: 11.5px; }
      .flow .fnode .fdot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
      .legend { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
      .legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--fg-subtle); }
      .legend .fdot { width: 8px; height: 8px; border-radius: 50%; }
      .toast {
        position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
        background: var(--surface); color: var(--fg); border: 1px solid var(--border);
        border-left: 4px solid var(--ok); padding: 12px 18px; border-radius: 10px;
        box-shadow: var(--shadow); opacity: 0; transition: 0.25s; z-index: 50; max-width: 520px;
      }
      .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      .toast.err { border-left-color: var(--danger); }
      .row { display: flex; align-items: center; gap: 10px; }
      .row.wrap { flex-wrap: wrap; }
      .danger-zone { display: flex; justify-content: flex-end; gap: 8px; }
    </style>
  </head>
  <body>
    <header>
      <div class="logo"><span class="dot"></span> Projects CMS</div>
      <span style="font-size:12px;opacity:0.85">Toyslab · soldevhassan.com</span>
      <div class="spacer"></div>
      <button class="btn ghost sm" id="themeBtn" title="Toggle theme">◐ Theme</button>
      <button class="btn save" id="saveBtn" disabled>Save</button>
      <span class="status" id="status"></span>
    </header>

    <div class="layout">
      <aside>
        <h2>Projects</h2>
        <div id="projList"></div>
        <button class="btn primary" id="addBtn" style="width:100%;margin-top:12px">+ Add project</button>
        <p class="hint" style="margin-top:14px">
          Order here = order on the site. Save writes
          <code>content/projects.json</code>, then push to publish.
        </p>
      </aside>

      <main id="editorHost">
        <div class="empty">Select a project on the left, or add a new one.</div>
      </main>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      /* ------------------------------- state -------------------------------- */
      const state = { projects: [], icons: [], editing: null, dirty: false };

      const ACCENT = {
        'accent-cyan': '43,143,230',
        'accent-violet': '94,180,245',
        'accent-emerald': '47,158,68',
        'accent-fuchsia': '94,180,245',
      };
      const KIND = {
        trigger: { c: '43,143,230', label: 'Trigger' },
        ai: { c: '94,180,245', label: 'AI' },
        process: { c: '148,163,184', label: 'Logic' },
        output: { c: '47,158,68', label: 'Output' },
      };
      const GRADIENTS = [
        'from-accent-emerald/25 via-accent-cyan/20 to-accent-fuchsia/25',
        'from-accent-cyan/25 via-accent-violet/20 to-accent-fuchsia/25',
        'from-accent-violet/25 via-accent-fuchsia/20 to-accent-cyan/25',
        'from-accent-emerald/25 via-accent-cyan/20 to-accent-violet/25',
        'from-accent-cyan/25 via-accent-emerald/20 to-accent-violet/25',
        'from-accent-fuchsia/25 via-accent-violet/20 to-accent-cyan/25',
        'from-accent-violet/25 via-accent-cyan/20 to-accent-emerald/25',
      ];

      const $ = (sel, root = document) => root.querySelector(sel);
      const esc = (s) =>
        String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

      function slugify(s) {
        return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
      }
      function gradientCss(str) {
        // Parse `from-X/aa via-Y/bb to-Z/cc` → a CSS linear-gradient.
        const stops = [];
        for (const part of String(str).split(/\s+/)) {
          const m = /^(from|via|to)-(accent-[a-z]+)\/(\d+)$/.exec(part);
          if (m && ACCENT[m[2]]) stops.push(`rgba(${ACCENT[m[2]]}, ${Number(m[3]) / 100})`);
        }
        if (stops.length < 2) stops.push('rgba(43,143,230,0.2)', 'rgba(47,158,68,0.2)');
        return `linear-gradient(135deg, ${stops.join(', ')})`;
      }

      /* --------------------------- model <-> form --------------------------- */
      function blankProject() {
        return {
          id: '', title: '', tagline: '', description: '', impact: '',
          emoji: '✨', gradient: GRADIENTS[0], features: [], tech: [],
          githubMode: 'default', githubUrl: '', demoMode: 'default', demoUrl: '',
          images: [], arch: [], _idDirty: false,
        };
      }
      function toModel(p) {
        const linkMode = (v) => (v === undefined || v === null || v === '' ? 'off' : v === 'default' ? 'default' : 'custom');
        return {
          id: p.id || '', title: p.title || '', tagline: p.tagline || '',
          description: p.description || '', impact: p.impact || '',
          emoji: p.emoji || '✨', gradient: p.gradient || GRADIENTS[0],
          features: (p.features || []).slice(), tech: (p.tech || []).slice(),
          githubMode: linkMode(p.github), githubUrl: p.github && p.github !== 'default' ? p.github : '',
          demoMode: linkMode(p.demo), demoUrl: p.demo && p.demo !== 'default' ? p.demo : '',
          images: (p.images || []).slice(),
          arch: (p.arch || []).map((s) => ({ title: s.title, nodes: (s.nodes || []).map((n) => ({ ...n })) })),
          _idDirty: true,
        };
      }
      function fromModel(m) {
        const link = (mode, url) => (mode === 'off' ? undefined : mode === 'default' ? 'default' : url.trim() || undefined);
        const out = {
          id: m.id.trim(), title: m.title.trim(), tagline: m.tagline.trim(),
          description: m.description.trim(),
          features: m.features.map((f) => f.trim()).filter(Boolean),
          tech: m.tech.map((t) => t.trim()).filter(Boolean),
          impact: m.impact.trim(),
        };
        const gh = link(m.githubMode, m.githubUrl);
        const dm = link(m.demoMode, m.demoUrl);
        if (gh) out.github = gh;
        if (dm) out.demo = dm;
        out.gradient = m.gradient;
        out.emoji = m.emoji.trim() || '✨';
        if (m.images.length) out.images = m.images.slice();
        if (m.arch.length) {
          out.arch = m.arch
            .map((s) => ({ title: s.title.trim(), nodes: s.nodes.map((n) => ({ label: n.label.trim(), icon: n.icon, kind: n.kind })) }))
            .filter((s) => s.title && s.nodes.length);
        }
        return out;
      }

      function markDirty() {
        state.dirty = true;
        $('#saveBtn').disabled = false;
        $('#status').textContent = 'Unsaved changes';
      }

      /* ------------------------------ rendering ----------------------------- */
      function renderList() {
        const host = $('#projList');
        host.innerHTML = '';
        state.projects.forEach((p, i) => {
          const el = document.createElement('div');
          el.className = 'proj-item' + (state.editing === i ? ' active' : '');
          el.innerHTML =
            `<div class="ord"><button data-up="${i}" title="Move up">▲</button><button data-down="${i}" title="Move down">▼</button></div>` +
            `<span class="emoji">${esc(p.emoji || '•')}</span>` +
            `<div class="meta"><div class="t">${esc(p.title || '(untitled)')}</div><div class="s">${esc(p.id || 'no-id')}</div></div>`;
          el.addEventListener('click', (ev) => {
            if (ev.target.closest('.ord')) return;
            openProject(i);
          });
          host.appendChild(el);
        });
        host.querySelectorAll('[data-up]').forEach((b) =>
          b.addEventListener('click', () => moveProject(+b.dataset.up, -1)));
        host.querySelectorAll('[data-down]').forEach((b) =>
          b.addEventListener('click', () => moveProject(+b.dataset.down, 1)));
      }

      function moveProject(i, dir) {
        const j = i + dir;
        if (j < 0 || j >= state.projects.length) return;
        const [item] = state.projects.splice(i, 1);
        state.projects.splice(j, 0, item);
        if (state.editing === i) state.editing = j;
        else if (state.editing === j) state.editing = i;
        markDirty();
        renderList();
      }

      function iconSelect(selected) {
        const groups = {};
        state.icons.forEach((e) => { (groups[e.group] ||= []).push(e.name); });
        let html = '';
        for (const g of Object.keys(groups)) {
          html += `<optgroup label="${esc(g)}">`;
          for (const name of groups[g]) html += `<option value="${esc(name)}"${name === selected ? ' selected' : ''}>${esc(name)}</option>`;
          html += '</optgroup>';
        }
        return html;
      }

      function openProject(i) {
        state.editing = i;
        renderList();
        renderEditor();
      }

      function renderEditor() {
        const host = $('#editorHost');
        if (state.editing == null) { host.innerHTML = '<div class="empty">Select a project on the left, or add a new one.</div>'; return; }
        const m = state.projects[state.editing];

        host.innerHTML = `
          <div class="grid2">
            <div>
              <div class="card">
                <h3>Details</h3>
                <label class="field"><span>Title</span><input type="text" id="f-title" value="${esc(m.title)}" /></label>
                <label class="field"><span>Slug / id <span class="hint">(kebab-case, used as the key)</span></span><input type="text" id="f-id" value="${esc(m.id)}" /></label>
                <label class="field"><span>Tagline</span><input type="text" id="f-tagline" value="${esc(m.tagline)}" /></label>
                <label class="field"><span>Description</span><textarea id="f-description">${esc(m.description)}</textarea></label>
                <label class="field"><span>Impact</span><textarea id="f-impact">${esc(m.impact)}</textarea></label>
                <div class="row">
                  <label class="field" style="width:90px"><span>Emoji</span><input type="text" id="f-emoji" value="${esc(m.emoji)}" maxlength="4" /></label>
                </div>
              </div>

              <div class="card">
                <h3>Features</h3>
                <div class="tags" id="tags-features"></div>
              </div>
              <div class="card">
                <h3>Tech stack</h3>
                <div class="tags" id="tags-tech"></div>
              </div>

              <div class="card">
                <h3>Accent gradient</h3>
                <div class="swatches" id="swatches"></div>
              </div>

              <div class="card">
                <h3>Links</h3>
                <label class="field"><span>GitHub button</span>
                  <div class="row wrap">
                    <div class="seg" id="seg-github">
                      <button data-m="default">Default</button><button data-m="custom">Custom URL</button><button data-m="off">Hidden</button>
                    </div>
                    <input type="text" id="f-githubUrl" placeholder="https://github.com/..." value="${esc(m.githubUrl)}" style="flex:1;min-width:200px" />
                  </div>
                  <p class="hint">“Default” uses your contact GitHub. “Custom” links a specific repo.</p>
                </label>
                <label class="field"><span>Demo button</span>
                  <div class="row wrap">
                    <div class="seg" id="seg-demo">
                      <button data-m="default">Default</button><button data-m="custom">Custom URL</button><button data-m="off">Hidden</button>
                    </div>
                    <input type="text" id="f-demoUrl" placeholder="https://..." value="${esc(m.demoUrl)}" style="flex:1;min-width:200px" />
                  </div>
                  <p class="hint">“Default” uses your booking / WhatsApp link.</p>
                </label>
              </div>

              <div class="card">
                <h3>Screenshots</h3>
                <div class="thumbs" id="thumbs"></div>
                <div class="uploader" id="uploader" style="margin-top:10px">⬆ Click to upload image(s) — saved into <code>public/projects/</code></div>
                <input type="file" id="fileInput" accept="image/*" multiple hidden />
              </div>
            </div>

            <div>
              <div class="card">
                <h3>Architecture diagram</h3>
                <div id="arch"></div>
                <button class="btn sm" id="addStage" style="margin-top:6px">+ Add stage</button>
              </div>

              <div class="card">
                <h3>Live preview <span class="hint">(real icons render in <code>npm run dev</code>)</span></h3>
                <div id="preview"></div>
              </div>

              <div class="card danger-zone">
                <button class="btn sm" id="dupBtn">Duplicate</button>
                <button class="btn sm danger" id="delBtn">Delete project</button>
              </div>
            </div>
          </div>`;

        // Text fields
        const bindText = (id, key, extra) => {
          const el = $('#' + id);
          el.addEventListener('input', () => { m[key] = el.value; if (extra) extra(); markDirty(); });
        };
        bindText('f-title', 'title', () => {
          if (!m._idDirty) { m.id = slugify(m.title); $('#f-id').value = m.id; }
          renderPreview(); renderList();
        });
        $('#f-id').addEventListener('input', () => { m._idDirty = true; m.id = $('#f-id').value; markDirty(); renderList(); });
        bindText('f-tagline', 'tagline', renderPreview);
        bindText('f-description', 'description', renderPreview);
        bindText('f-impact', 'impact');
        bindText('f-emoji', 'emoji', renderPreview);

        renderTags('features'); renderTags('tech');
        renderSwatches(); renderLinks(); renderThumbs(); renderArch(); renderPreview();

        // Links segmented controls
        $('#f-githubUrl').addEventListener('input', () => { m.githubUrl = $('#f-githubUrl').value; markDirty(); });
        $('#f-demoUrl').addEventListener('input', () => { m.demoUrl = $('#f-demoUrl').value; markDirty(); });

        // Images
        $('#uploader').addEventListener('click', () => $('#fileInput').click());
        $('#fileInput').addEventListener('change', handleFiles);

        $('#addStage').addEventListener('click', () => { m.arch.push({ title: 'Stage', nodes: [{ label: 'Node', icon: state.icons[0]?.name || 'workflow', kind: 'process' }] }); markDirty(); renderArch(); renderPreview(); });
        $('#dupBtn').addEventListener('click', duplicateCurrent);
        $('#delBtn').addEventListener('click', deleteCurrent);
      }

      function renderTags(key) {
        const m = state.projects[state.editing];
        const host = $('#tags-' + key);
        host.innerHTML =
          m[key].map((t, i) => `<span class="tag">${esc(t)}<button data-i="${i}" title="Remove">×</button></span>`).join('') +
          `<input type="text" placeholder="Type &amp; Enter…" />`;
        host.querySelectorAll('button[data-i]').forEach((b) =>
          b.addEventListener('click', () => { m[key].splice(+b.dataset.i, 1); markDirty(); renderTags(key); renderPreview(); }));
        const input = host.querySelector('input');
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && input.value.trim()) {
            e.preventDefault(); m[key].push(input.value.trim()); input.value = ''; markDirty(); renderTags(key); renderPreview();
            $('#tags-' + key).querySelector('input').focus();
          }
        });
      }

      function renderSwatches() {
        const m = state.projects[state.editing];
        const host = $('#swatches');
        host.innerHTML = GRADIENTS.map((g) =>
          `<div class="swatch${g === m.gradient ? ' active' : ''}" data-g="${esc(g)}" style="background:${gradientCss(g)}"></div>`).join('');
        host.querySelectorAll('.swatch').forEach((s) =>
          s.addEventListener('click', () => { m.gradient = s.dataset.g; markDirty(); renderSwatches(); renderPreview(); }));
      }

      function renderLinks() {
        const m = state.projects[state.editing];
        for (const which of ['github', 'demo']) {
          const seg = $('#seg-' + which);
          const mode = m[which + 'Mode'];
          seg.querySelectorAll('button').forEach((b) => {
            b.classList.toggle('on', b.dataset.m === mode);
            b.onclick = () => { m[which + 'Mode'] = b.dataset.m; markDirty(); renderLinks(); };
          });
          $('#f-' + which + 'Url').style.display = mode === 'custom' ? '' : 'none';
        }
      }

      function renderThumbs() {
        const m = state.projects[state.editing];
        const host = $('#thumbs');
        host.innerHTML = m.images.map((src, i) => `
          <div class="thumb">
            <img src="${esc(src)}" alt="" onerror="this.style.opacity=0.3" />
            <div class="bar">
              <button data-left="${i}" title="Move left">◀</button>
              <button data-del="${i}" title="Remove">🗑</button>
              <button data-right="${i}" title="Move right">▶</button>
            </div>
          </div>`).join('');
        host.querySelectorAll('[data-del]').forEach((b) => b.addEventListener('click', () => { m.images.splice(+b.dataset.del, 1); markDirty(); renderThumbs(); renderPreview(); }));
        host.querySelectorAll('[data-left]').forEach((b) => b.addEventListener('click', () => swap(m.images, +b.dataset.left, -1)));
        host.querySelectorAll('[data-right]').forEach((b) => b.addEventListener('click', () => swap(m.images, +b.dataset.right, 1)));
        function swap(arr, i, d) { const j = i + d; if (j < 0 || j >= arr.length) return; [arr[i], arr[j]] = [arr[j], arr[i]]; markDirty(); renderThumbs(); renderPreview(); }
      }

      async function handleFiles(e) {
        const m = state.projects[state.editing];
        const files = [...e.target.files];
        e.target.value = '';
        for (const file of files) {
          try {
            const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
            const resp = await fetch('/api/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ projectId: m.id || 'project', filename: file.name, dataUrl }) });
            const json = await resp.json();
            if (!resp.ok) throw new Error(json.error || 'Upload failed');
            m.images.push(json.path);
            markDirty(); renderThumbs(); renderPreview();
          } catch (err) { toast(err.message, true); }
        }
      }

      function renderArch() {
        const m = state.projects[state.editing];
        const host = $('#arch');
        host.innerHTML = m.arch.map((stage, si) => `
          <div class="stage" data-si="${si}">
            <div class="shead">
              <input type="text" class="st-title" value="${esc(stage.title)}" placeholder="Stage title" />
              <button class="btn sm" data-sup="${si}" title="Move up">▲</button>
              <button class="btn sm" data-sdown="${si}" title="Move down">▼</button>
              <button class="btn sm danger" data-sdel="${si}" title="Delete stage">✕</button>
            </div>
            ${stage.nodes.map((n, ni) => `
              <div class="node" data-ni="${ni}">
                <input type="text" class="n-label" value="${esc(n.label)}" placeholder="Node label" />
                <select class="n-icon">${iconSelect(n.icon)}</select>
                <select class="n-kind">
                  ${Object.keys(KIND).map((k) => `<option value="${k}"${k === n.kind ? ' selected' : ''}>${KIND[k].label}</option>`).join('')}
                </select>
                <button class="btn sm danger" data-ndel="${ni}" title="Remove node">✕</button>
              </div>`).join('')}
            <button class="btn sm" data-naddr="${si}" style="margin-top:4px">+ Node</button>
          </div>`).join('') || '<p class="hint">No stages yet. Add one to build the pipeline.</p>';

        host.querySelectorAll('.stage').forEach((stageEl) => {
          const si = +stageEl.dataset.si;
          const stage = m.arch[si];
          stageEl.querySelector('.st-title').addEventListener('input', (e) => { stage.title = e.target.value; markDirty(); renderPreview(); });
          stageEl.querySelectorAll('.node').forEach((nodeEl) => {
            const ni = +nodeEl.dataset.ni;
            const node = stage.nodes[ni];
            nodeEl.querySelector('.n-label').addEventListener('input', (e) => { node.label = e.target.value; markDirty(); renderPreview(); });
            nodeEl.querySelector('.n-icon').addEventListener('change', (e) => { node.icon = e.target.value; markDirty(); renderPreview(); });
            nodeEl.querySelector('.n-kind').addEventListener('change', (e) => { node.kind = e.target.value; markDirty(); renderPreview(); });
            nodeEl.querySelector('[data-ndel]').addEventListener('click', () => { stage.nodes.splice(ni, 1); markDirty(); renderArch(); renderPreview(); });
          });
          stageEl.querySelector('[data-naddr]').addEventListener('click', () => { stage.nodes.push({ label: 'Node', icon: state.icons[0]?.name || 'workflow', kind: 'process' }); markDirty(); renderArch(); renderPreview(); });
          stageEl.querySelector('[data-sdel]').addEventListener('click', () => { m.arch.splice(si, 1); markDirty(); renderArch(); renderPreview(); });
          stageEl.querySelector('[data-sup]').addEventListener('click', () => { if (si > 0) { [m.arch[si - 1], m.arch[si]] = [m.arch[si], m.arch[si - 1]]; markDirty(); renderArch(); renderPreview(); } });
          stageEl.querySelector('[data-sdown]').addEventListener('click', () => { if (si < m.arch.length - 1) { [m.arch[si + 1], m.arch[si]] = [m.arch[si], m.arch[si + 1]]; markDirty(); renderArch(); renderPreview(); } });
        });
      }

      function renderPreview() {
        const m = state.projects[state.editing];
        const host = $('#preview');
        const shot = m.images.length
          ? `<img src="${esc(m.images[0])}" alt="" onerror="this.style.display='none'" /><span class="emoji">${esc(m.emoji)}</span>`
          : `<span class="emoji">${esc(m.emoji)}</span>`;
        const flow = m.arch.length ? `
          <div class="flow">
            ${m.arch.map((s) => `
              <div class="col">
                <p>${esc(s.title)}</p>
                ${s.nodes.map((n) => { const c = (KIND[n.kind] || KIND.process).c; return `<div class="fnode" style="border-color:rgba(${c},0.4);background:rgba(${c},0.1)"><span class="fdot" style="background:rgb(${c})"></span>${esc(n.label)}</div>`; }).join('')}
              </div>`).join('')}
          </div>
          <div class="legend">${Object.keys(KIND).map((k) => `<span><span class="fdot" style="background:rgb(${KIND[k].c})"></span>${KIND[k].label}</span>`).join('')}</div>` : '';
        host.innerHTML = `
          <div class="preview-card">
            <div class="preview-shot" style="background:${gradientCss(m.gradient)}">${shot}</div>
            <div class="preview-body">
              <div class="tagline">${esc(m.tagline || 'Tagline')}</div>
              <h4>${esc(m.title || 'Project title')}</h4>
              <p>${esc(m.description || 'Description…')}</p>
              <div class="chips">${m.tech.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
            </div>
            ${flow}
          </div>`;
      }

      /* ------------------------------- actions ------------------------------ */
      function duplicateCurrent() {
        const src = JSON.parse(JSON.stringify(state.projects[state.editing]));
        src.title += ' (copy)';
        let base = (src.id || 'project') + '-copy'; let id = base; let n = 2;
        const ids = new Set(state.projects.map((p) => p.id));
        while (ids.has(id)) id = base + '-' + n++;
        src.id = id; src._idDirty = true;
        state.projects.splice(state.editing + 1, 0, src);
        markDirty(); openProject(state.editing + 1);
      }
      function deleteCurrent() {
        const m = state.projects[state.editing];
        if (!confirm(`Delete “${m.title || m.id}”? (uploaded images stay in public/projects)`)) return;
        state.projects.splice(state.editing, 1);
        state.editing = state.projects.length ? Math.max(0, state.editing - 1) : null;
        markDirty(); renderList(); renderEditor();
      }

      async function save() {
        try {
          const payload = state.projects.map(fromModel);
          const resp = await fetch('/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const json = await resp.json();
          if (!resp.ok) throw new Error(json.error || 'Save failed');
          state.dirty = false; $('#saveBtn').disabled = true; $('#status').textContent = 'Saved ✓';
          toast(`Saved ${json.count} project(s). Now: git add → commit → push to publish.`);
        } catch (err) { toast(err.message, true); $('#status').textContent = 'Save failed'; }
      }

      let toastTimer;
      function toast(msg, isErr) {
        const t = $('#toast'); t.textContent = msg; t.className = 'toast show' + (isErr ? ' err' : '');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.className = 'toast' + (isErr ? ' err' : '')), isErr ? 6000 : 4500);
      }

      /* -------------------------------- init -------------------------------- */
      $('#saveBtn').addEventListener('click', save);
      $('#addBtn').addEventListener('click', () => { state.projects.push(blankProject()); markDirty(); openProject(state.projects.length - 1); });
      $('#themeBtn').addEventListener('click', () => {
        const order = ['system', 'dark', 'light'];
        const cur = document.documentElement.getAttribute('data-theme');
        document.documentElement.setAttribute('data-theme', order[(order.indexOf(cur) + 1) % order.length]);
      });
      window.addEventListener('beforeunload', (e) => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

      (async function load() {
        try {
          const [projects, icons] = await Promise.all([
            fetch('/api/projects').then((r) => r.json()),
            fetch('/api/icons').then((r) => r.json()),
          ]);
          state.icons = icons;
          state.projects = projects.map(toModel);
          renderList();
          if (state.projects.length) openProject(0);
        } catch (err) { toast('Failed to load: ' + err.message, true); }
      })();
    </script>
  </body>
</html>
